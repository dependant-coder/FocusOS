name: FocusOS CI

on:
  push:
    branches: [main, master, phase-*, feat-*, fix-*]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Build, and Test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [Asia/Kolkata, America/Los_Angeles, UTC]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run build (TypeScript & Vite)
        run: npm run build

      - name: Run unit tests
        run: npm run test
        env:
          TZ: ${{ matrix.tz }}
